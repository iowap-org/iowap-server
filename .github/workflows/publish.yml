name: Publish to PyPI

# publish = the basics: checkout the wheel-v* tag, build the wheel,
# twine check, idempotent upload. No test matrix here — the suite runs
# in the local env (410+2 green, 3.11) before every deploy, and the CI
# matrix channel (3.11/3.12) added red noise without a consumer
# (T-266 decision, Ronny 2026-10-31: CI stays publish-only).
#
# Idempotency: PyPI versions are immutable — an intentional re-run for an
# already-published version hits "File already exists" and is treated as
# success instead of turning the run red.
#
# Skip behavior: when the PYPI_TOKEN repo secret is missing, the upload step
# does NOT fail — it skips with a notice and leaves the wheel as a run
# artifact ("wheel built, upload not configured"), keeping the run green.

on:
  push:
    tags:
      - "wheel-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Wheel tag to publish (e.g. wheel-v2.0.1)"
        required: true
        default: "wheel-v2.0.1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tag push → the pushed tag; manual dispatch → the chosen tag input
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel (only the wheel — no sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Guard — wheel-v* tag must match pyproject version
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          TAG="${DISPATCH_TAG:-$REF_NAME}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Publishing tag $TAG (pyproject version: $VER)"
          if [ "$TAG" != "wheel-v$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER (expected wheel-v$VER)"
            exit 1
          fi

      - name: twine check
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*.whl
          ls -la dist/

      - name: Upload wheel as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*.whl

      - name: Publish to PyPI (idempotent)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --quiet twine
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::notice::PYPI_TOKEN secret not set on $GITHUB_REPOSITORY — skipping publish. The wheel is kept as a run artifact; PyPI stays unchanged. To enable: gh secret set PYPI_TOKEN -R $GITHUB_REPOSITORY"
            exit 0
          fi
          export TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN"
          if ! twine upload --non-interactive dist/*.whl | tee /tmp/twine.log; then
            if grep -qi "already exists" /tmp/twine.log; then
              echo "Version already on PyPI — idempotent re-run, treated as success"
              exit 0
            fi
            exit 1
          fi