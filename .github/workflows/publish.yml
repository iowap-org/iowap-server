name: Publish to PyPI

# Publishes the iowap-server wheel to PyPI whenever a wheel-v* tag is
# pushed or the workflow is manually dispatched for one (tag: wheel-v<version>).
# Pipeline shape mirrors iowap-org/iowap-client-mcp T-010b / iowap-node T-228:
# build the wheel, guard tag-vs-version parity, twine check, then the
# idempotent token upload. Backend: setuptools (pyproject build-system).
#
# Idempotency (same rule as node's publish-pypi job): PyPI versions are
# immutable, so an intentional re-run for an already-published version hits
# "File already exists" — that means 'published successfully earlier' and is
# treated as success instead of turning the run red.
#
# Skip behavior: when the PYPI_TOKEN repo secret is missing, the upload step
# does NOT fail — it skips with a notice and leaves the wheel as a run
# artifact, so the pipeline reads "wheel built, upload not configured"
# instead of red noise.
#
# T-266: a pytest test job runs BEFORE publish (matrix 3.11 + 3.12) — a red
# suite must no longer produce a wheel. The lint step mirrors iowap-node
# T-242's high-signal approach but starts as an explicit exit-zero no-op:
# the repo carries 793 ruff findings (UP/B/I/SIM/... debt) tracked in T-266
# sweep B; sharpen this gate to a strict `ruff check .` once that debt is
# paid. It must not silently block publishing meanwhile.

on:
  push:
    tags:
      - "wheel-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Wheel tag to publish (e.g. wheel-v2.0.1)"
        required: false
        default: "wheel-v2.0.1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --quiet -e .
          python -m pip install --quiet pytest pytest-asyncio ruff

      - name: Test gate (pytest)
        run: python -m pytest -q

      - name: Lint gate (exit-zero until T-266 lint debt is paid)
        run: python -m ruff check . || echo "::warning::ruff findings remain — T-266 sweep will tighten this to a blocking gate"

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tag push → the pushed tag; manual dispatch → the chosen tag input
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel (only the wheel — no sdist)
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - name: Guard — wheel-v* tag must match pyproject version
        env:
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          TAG="${DISPATCH_TAG:-$REF_NAME}"
          echo "Publishing for tag: $TAG"
          case "$TAG" in
            wheel-v*)
              VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
              echo "pyproject version: $VER"
              if [ "$TAG" != "wheel-v$VER" ]; then
                echo "::error::tag $TAG does not match package version $VER (expected wheel-v$VER)"
                exit 1
              fi
              ;;
            *)
              echo "::error::not a wheel-v* tag: $TAG"
              exit 1
              ;;
          esac

      - name: twine check
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*.whl
          ls -la dist/

      - name: Upload wheel as run artifact (always, also when publish is skipped)
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheel
          path: dist/*.whl

      - name: Publish to PyPI (idempotent)
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --quiet twine
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::notice::PYPI_TOKEN secret not set on $GITHUB_REPOSITORY — skipping publish. The wheel is kept as a run artifact; PyPI stays unchanged. To enable: gh secret set PYPI_TOKEN -R $GITHUB_REPOSITORY"
            exit 0
          fi
          export TWINE_USERNAME=__token__ TWINE_PASSWORD="$PYPI_TOKEN"
          if ! twine upload --non-interactive dist/*.whl | tee /tmp/twine.log; then
            if grep -qi "already exists" /tmp/twine.log; then
              echo "Version already on PyPI — idempotent re-run, treated as success"
              exit 0
            fi
            exit 1
          fi