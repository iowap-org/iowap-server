[project]
name = "relay-server"
version = "2.0.0"
description = "IOWAP Relay Server — API, Scheduler, Auth, Dashboard, Metrics"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.18",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "zeroconf>=0.63",
    "slowapi>=0.1",
    "markdown>=3.6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
uvloop = [
    "uvloop>=0.19",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
relay-server = "relay_server.main:main"
relay-recovery = "relay_server.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay_server"]

[tool.setuptools.package-dir]
"relay_server" = "."