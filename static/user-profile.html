<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User Profile — AI Relay Cluster</title>
  <link rel="stylesheet" href="/relay/v2/dashboard/static/cluster.css" />
</head>
<body>

  <!-- ===== Nav ===== -->
  <nav class="topnav">
    <div class="logo">⟐ relay<span>.cluster</span></div>
    <a class="topnav-link" href="/relay/v2/dashboard/">Overview</a>
    <a class="topnav-link" href="/relay/v2/dashboard/#nodes">Nodes</a>
    <a class="topnav-link" href="/relay/v2/dashboard/#users">Users</a>
    <div class="spacer"></div>
    <a class="btn btn-primary" href="/relay/v2/dashboard/admin">Admin</a>
  </nav>

  <!-- ===== Profile hero ===== -->
  <section class="hero profile">
    <div id="userAvatar" class="avatar-lg">?</div>
    <div class="head-text">
      <h1 id="userName">loading…</h1>
      <p id="userRole" class="sub"></p>
      <span id="statusPill" class="status-pill"><span class="status-dot"></span> loading…</span>
    </div>
  </section>

  <div class="container">

    <!-- Stats -->
    <div id="stats" class="meta-grid"></div>

    <!-- Groups -->
    <div class="section">
      <h2>👥 Groups</h2>
    </div>
    <div class="panel">
      <div id="groups" class="chip-row"></div>
    </div>

    <!-- Recent activity -->
    <div class="section">
      <h2>📡 Recent Activity</h2>
    </div>
    <div id="activity" class="activity"></div>

  </div>

  <!-- ===== Footer ===== -->
  <footer class="footer-mockup">
    <p><a href="/relay/v2/dashboard/">AI Relay Service</a> · User Profile · <a href="/relay/v2/dashboard/">← back to portal</a></p>
  </footer>

  <script src="/relay/v2/dashboard/static/user-profile.js"></script>
</body>
</html>
